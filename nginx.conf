server {
    listen 80;
    server_name _;

    # 后端上传限制为 10MB，nginx 默认 1m 会拦截上传请求
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---------- 后端 API（/prod-api 前缀转发时去除，与 Vite dev 代理行为一致） ----------
    location /prod-api/ {
        proxy_pass http://eshop-app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（通知推送等长连接）：关闭缓冲，拉长读超时
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---------- 上传文件静态资源（由后端 serve） ----------
    location /uploads/ {
        proxy_pass http://eshop-app:8080;
        proxy_set_header Host $host;
    }

    # ---------- AI 客服（Python FastAPI，可选服务 eshop-ai） ----------
    # 使用变量 + docker 内置 resolver：AI 容器未启动时 nginx 仍可正常启动，仅该路径 502
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /ai/ {
        set $ai_upstream eshop-ai:5000;
        proxy_pass http://$ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI 推理耗时较长
        proxy_read_timeout 120s;
    }

    # ---------- 前端静态资源 ----------
    # 带 hash 的资源永久缓存
    location ~* ^/(js|img|fonts|assets|media)/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 不缓存，保证发版即生效
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        # 兼容 history 路由（当前为 hash 路由，无实际影响）
        try_files $uri $uri/ /index.html;
    }
}
